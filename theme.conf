# Settings for the generated theme. Change these, then rebuild:
#
#     makepkg -sif        (Arch)      or      sudo ./install.sh
#
# Every value can also be given as an environment variable of the same name,
# which wins over this file:  PLYMOUTH_NAME="Ada" makepkg -sif

# Shown as "Welcome, <NAME>" at the passphrase prompt and "Goodbye, <NAME>"
# on the way down. Leave it empty to use the account's real name, falling
# back to its login name.
NAME=Guillermo

# Panel size the assets are rendered for. "auto" reads the preferred mode of
# the largest connected display from /sys/class/drm, which works with no
# session running. Set it explicitly (e.g. 1920x1080) if auto guesses wrong,
# for instance when building inside a chroot.
RESOLUTION=auto

# The large word breathing behind everything. システム is Japanese for
# "system"; any short string works, and the same word fills the vertical
# column at the right if it is four halfwidth katakana.
GHOST_WORD=システム
