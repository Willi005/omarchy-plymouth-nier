# Configuration for the NieR theme that covers the whole Omarchy boot chain:
# the Limine boot menu, the LUKS passphrase prompt, and the shutdown screen.
#
# Installed as /etc/omarchy-plymouth-nier.conf. Pacman preserves your edits
# across upgrades and leaves a .pacnew when the defaults change, so this file
# is yours once it is installed.
#
# Nothing here takes effect on its own: every value is baked into pre-rendered
# images, because Plymouth's only scaler is nearest-neighbour and destroys
# antialiased artwork. After editing, run
#
#     sudo omarchy-nier-reconfigure
#
# which regenerates everything, re-themes the boot menu and rebuilds the boot
# image. Add --dry-run to see what would change without touching anything.
#
# Every key also works as an environment variable of the same name prefixed
# NIER_, which wins over this file:
#
#     NIER_SCALE=1.0 sudo omarchy-nier-reconfigure


# ---------------------------------------------------------------------------
# Palette
#
# Four palettes ship below. Exactly ONE block may be uncommented at a time.
# This file is read top to bottom and the last assignment of a key wins, so
# leaving two blocks active does not blend them -- it silently picks the lower
# one. If that happens the generators print a warning naming both lines and
# which one won, but the safe habit is to comment the old block before
# uncommenting the new one.
#
# All five colours are shared by the boot menu, the passphrase screen and the
# shutdown screen, so changing one retints the whole chain rather than letting
# the three drift apart. Their roles:
#
#   BONE    Everything the eye is meant to read: the greeting, the typed
#           marks, the password rule, the boot menu entries, the HUD brackets.
#
#   DIM     The large word breathing behind the passphrase prompt, and nothing
#           else. It is deliberately close to the background: if you can read
#           it comfortably it is too strong and starts competing with the
#           password field.
#
#   CHROME  Secondary text that should be noticed but not read first: the
#           bottom hint, the boot menu's help rows, the attempt counter. The
#           boot menu derives one brighter step from it, for the countdown
#           digit, by blending towards BONE.
#
#   RUST    The single chromatic note in the whole theme, and it appears only
#           while a passphrase is being rejected. Using it anywhere else
#           spends the one moment the design has to raise its voice.
#
#   GROUND  The surface everything sits on. It is a real colour, not an
#           assumption: the Plymouth screens paint it and the boot menu's
#           wallpaper is filled with it.
#
# The three shipped palettes hold the same contrast ratios against GROUND for
# CHROME, DIM and RUST, so the composition reads the same whichever you pick;
# what changes is the ground and the ink. Ratios are quoted against GROUND.
# ---------------------------------------------------------------------------

# --- BLACK ------------------------------------------------------- ACTIVE ---
# The original. Bone on near-black, the NieR:Automata terminal read. GROUND is
# not pure #000000: a hair of value keeps OLED panels from crushing the
# dimmest ambient glyphs to nothing. BONE sits at 12.3:1.
BONE=#CFC9B0
DIM=#4A4638
CHROME=#55503F
RUST=#B0563F
GROUND=#050505

# --- YORHA LIGHT -----------------------------------------------------------
# The game's own menu palette: warm paper, dark warm ink. Taken from the
# YoRHa UI and then deepened slightly -- the exact screenshot values put the
# greeting at 5.0:1, and a passphrase prompt read at 3am deserves more
# headroom than that. BONE lands at 7.1:1, which is the softest of the three
# and the closest to how the menus actually look in the game.
# BONE=#3B382F
# DIM=#8F876C
# CHROME=#847C62
# RUST=#9D3B23
# GROUND=#CFC9B4

# --- FLEXOKI LIGHT ---------------------------------------------------------
# Built from Flexoki's own tokens, for a machine already running that theme:
# paper, tx, tx-3, base-500 and red-400. Two of those are not the obvious
# pick and the reason matters. CHROME is base-500 rather than tx-2, because
# tx-2 reaches 5.0:1 against paper -- that is primary-text contrast, and
# CHROME is the secondary tone. RUST is red-400 rather than red-600, because
# red-600 reaches 6.2:1 and shouts, while red-400 lands at 4.2:1, almost
# exactly where rust sits in the black palette. This is much the crispest of
# the three: BONE at 18.6:1. It reads as an interface rather than a screen.
# BONE=#100F0F
# DIM=#B7B5AC
# CHROME=#878580
# RUST=#D14D41
# GROUND=#FFFCF0

# --- CUSTOM ----------------------------------------------------------------
# Your own five. Comment out whichever block is active above, uncomment these
# and fill them in; #RGB and #RRGGBB are both accepted and anything else is
# refused by name rather than silently substituted.
#
# Two things worth knowing before you pick values. Nothing is tinted at run
# time -- every colour is baked into pre-rendered PNGs, so the artwork is
# regenerated on `sudo omarchy-nier-reconfigure` and never after. And the
# ambient field is drawn as BONE at 13-36% opacity over GROUND, so what
# governs its presence is the distance between those two, not DIM.
# BONE=
# DIM=
# CHROME=
# RUST=
# GROUND=


# ---------------------------------------------------------------------------
# The ambient field
#
# The scatter of katakana behind the passphrase prompt. It never appears on
# the shutdown screen or in the boot menu.
# ---------------------------------------------------------------------------

# Loose glyphs scattered across the screen. Each one breathes and swaps to a
# different letter on its own timer, so the field reads as motion rather than
# as a static pattern. Raising this past roughly 60 starts to compete with the
# password field for attention.
GLYPHS=20

# Short vertical piles of glyphs, kept to the outer thirds of the screen so
# they never crowd the login block. They read as structure against the loose
# glyphs' drift.
STACKS=6

# How tall a pile gets, in glyphs. The length is picked at random per pile
# between these two, which is what stops the stacks looking like a row of
# identical columns.
STACK_MIN=2
STACK_MAX=6

# The pool the field draws from: halfwidth katakana. Every letter here becomes
# four pre-rendered PNGs (three ambient sizes plus the glitch size), so a much
# larger alphabet means a noticeably larger package for no visible gain.
ALPHABET=ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ

# The vertical column of letters at the right of the passphrase screen. Leave
# it empty to derive it from GHOST_WORD, mapping the fullwidth word back to
# halfwidth through the alphabet, so システム becomes ｼｽﾃﾑ and the same word
# appears twice: once large and blurred, once as a column. Set it to override.
COLUMN=

# The large word breathing behind everything. システム is Japanese for
# "system". Any short string works, but note it is rendered with the CJK font
# and blurred, so Latin text tends to look like a mistake rather than a
# deliberate choice.
GHOST_WORD=システム

# How much of the screen's width the ghost word may span, as a fraction. The
# generator shrinks the pointsize until it fits, so this is a ceiling and not
# a target. Much above 0.7 and it stops reading as a background.
GHOST_MAX_WIDTH=0.62

# Extra breathing room the loose glyphs keep away from the login block, as a
# fraction of the screen's shorter side. The block itself -- the greeting, the
# password rule, and the ACCESS DENIED and ATTEMPT labels -- is always
# protected; this only widens the margin around it. The field is scenery, and a
# katakana sitting on the text you have to read at 3am looks like a rendering
# fault rather than atmosphere. 0 keeps the glyphs right up against the block.
# The vertical stacks respect the same box and their bands shrink as it grows.
KEEPOUT=0.035

# Set to off to remove the ambient field completely: no loose glyphs, no
# stacks, no vertical column. The ghost word, the greeting and the password
# rule stay. This is the closest thing to a "quiet" variant of the theme.
FIELD=on


# ---------------------------------------------------------------------------
# Composition and text
# ---------------------------------------------------------------------------

# Global size factor for the whole composition. It drives both the artwork's
# pointsizes and the layout ratios, so everything shrinks or grows as one
# piece instead of drifting apart. 1.00 was the first native-resolution pass
# and felt oversized; 0.70 is the current design. Values outside 0.2 to 2.0
# are clamped.
SCALE=0.70

# Shown in the greeting and the farewell. Empty means "work it out": the
# account's real name from GECOS, falling back to its capitalised login name.
# Shipping a name here would greet every installation with somebody else's, so
# the default stays empty. If the login name is not what you want on screen,
# either set it below or give the account a real name once and every tool
# benefits:  sudo chfn -f "Ada Lovelace" $USER
NAME=

# The greeting above the passphrase field, and the farewell on the way down.
# {name} is replaced by NAME. These are rendered as images at build time, so
# any script the font covers will work.
WELCOME=Welcome, {name}
GOODBYE=Goodbye, {name}

# The kerned line along the bottom edge of the passphrase screen. It hides as
# soon as you type the first character, and stays hidden after a rejected
# attempt, so it is guidance for the first look rather than a permanent label.
HINT=TYPE A PASSWORD  ·  ENTER TO UNLOCK

# Panel size the artwork is rendered for. "auto" reads the preferred mode of
# the largest connected display from /sys/class/drm, which works with no
# session running and inside a package build. Set it explicitly, e.g.
# 1920x1080, when building in a chroot or for a different machine.
RESOLUTION=auto


# ---------------------------------------------------------------------------
# The Limine boot menu
#
# This screen is a 1-bit character grid, not a graphics engine, so it takes
# the restrained version of the same language: the palette above, four corner
# brackets, and nothing behind the text.
# ---------------------------------------------------------------------------

# The line centred at the top of the boot menu. Keep it short: Limine renders
# it in a bitmap font that is always 8 pixels wide per glyph, so long strings
# get wide fast and there is no way to make them smaller.
BRANDING=OMARCHY

# The corner brackets, as fractions of the screen's shorter side rather than
# pixel counts, so they hold the same proportion from 1366x768 to 3840x2160.
# INSET is how far in from the edge they sit; ARM is how long each leg is.
BRACKET_INSET=0.030
BRACKET_ARM=0.065

# Limine's two help rows: "ARROWS Select ENTER Boot E Edit" and "S Firmware
# Setup B Blank Entry". Turning them off is quieter, but this is the menu you
# reach for when something is already broken, so consider leaving them on.
MENU_HELP=on
