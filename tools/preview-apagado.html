<title>Apagado Omarchy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;400;700&family=Noto+Sans+JP:wght@300;500&display=swap">

<style>
  :root {
    --ground: #050505;
    --bone: #CFC9B0;
    --bone-dim: #4A4638;
    --chrome: #55503F;
    --chrome-hi: #8C8770;
    --rust: #B0563F;
    /* Page chrome, derived from the two ends of the palette so the strip
       around the screen follows whichever palette is being previewed. */
    --panel: #0B0B0A;
    --line: #151513;
    --field: #050505;
    --border: #1D1C1A;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--bone);
    font-family: var(--mono);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  /* The screen needs a floor. It is the only element here that can shrink,
     so on a short panel flex:1 handed all of its height to the controls and
     the canvas collapsed to nothing. Below this height the page scrolls
     instead. */
  #screen { flex: 1; position: relative; min-height: 52vh; }
  canvas { display: block; width: 100%; height: 100%; }

  #controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1.25rem 1.75rem;
    padding: 0.85rem 1.25rem;
    border-top: 1px solid var(--line);
    background: var(--panel);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
  }

  .ctl { display: flex; align-items: center; gap: 0.55rem; }

  .ctl label, legend {
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--chrome);
    font-size: 0.62rem;
    white-space: nowrap;
  }

  input[type="text"] {
    background: var(--field);
    border: 1px solid var(--border);
    color: var(--bone);
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    padding: 0.3rem 0.55rem;
    width: 12rem;
  }

  input:focus-visible, button:focus-visible {
    outline: 1px solid var(--chrome-hi);
    outline-offset: 2px;
  }

  button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--chrome-hi);
    font-family: var(--mono);
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
  }

  button:hover { border-color: var(--chrome-hi); color: var(--bone); }
  button[aria-pressed="true"] { border-color: var(--bone); color: var(--bone); }

  .group { display: flex; gap: 0.4rem; }

  #readout {
    margin-left: auto;
    color: var(--chrome);
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* The palette row spans the strip's full width, so the five keys read as
     one set rather than as five more controls competing with the rest. */
  #palrow {
    flex-basis: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 1.15rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--line);
  }

  .key {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.6rem;
    letter-spacing: 0.16em;
    color: var(--chrome);
    text-transform: uppercase;
  }

  /* Two of the five keys are never drawn on the way down: there is no ghost
     word and no rejected passphrase here. They stay in the row because the
     row is the config block, but they are marked as inert. */
  .key.inert { opacity: 0.45; }

  .key b {
    color: var(--chrome-hi);
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.1em;
  }

  .key input[type="color"] {
    inline-size: 1.15rem;
    block-size: 1.15rem;
    padding: 0;
    border: 1px solid var(--border);
    background: none;
    cursor: pointer;
  }

  .key input[type="color"]:disabled { cursor: default; opacity: 1; }
  .key input[type="color"]::-moz-color-swatch { border: none; }
  .key input[type="color"]::-webkit-color-swatch { border: none; }
  .key input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }

  #confout {
    margin-left: auto;
    color: var(--chrome);
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    white-space: nowrap;
    overflow-x: auto;
    user-select: all;
  }

  select {
    background: var(--field);
    border: 1px solid var(--border);
    color: var(--bone);
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    padding: 0.3rem 0.55rem;
    cursor: pointer;
  }

  select:focus-visible { outline: 1px solid var(--chrome-hi); outline-offset: 2px; }
</style>

<div id="screen"><canvas id="c"></canvas></div>

<div id="controls">
  <div class="ctl">
    <span class="group" role="group" aria-label="Variant">
      <button id="v1" aria-pressed="true">A · text only</button>
      <button id="v2" aria-pressed="false">B · rule + label</button>
      <button id="v3" aria-pressed="false">C · HUD brackets</button>
    </span>
  </div>
  <div class="ctl">
    <label for="msg">Farewell</label>
    <input id="msg" type="text" value="Goodbye, Guillermo" maxlength="34" spellcheck="false">
  </div>
  <div class="ctl">
    <label for="sub">Label</label>
    <input id="sub" type="text" value="SYSTEM OFFLINE" maxlength="26" spellcheck="false" style="width:9rem">
  </div>
  <div class="ctl">
    <label for="palette">Palette</label>
    <select id="palette">
      <option value="dark" selected>Dark — bone on black</option>
      <option value="light">Light — YoRHa menu</option>
      <option value="flexoki">Light — Flexoki</option>
      <option value="custom">Custom</option>
    </select>
  </div>
  <button id="replay">Replay</button>
  <span id="readout">variant A</span>
  <div id="palrow"></div>
</div>

<script>
(() => {
  // ---- palette ------------------------------------------------------
  // The same five keys as /etc/omarchy-plymouth-nier.conf, so what this row
  // shows can be pasted straight into the config. See the login preview for
  // how the light set was derived; DIM and RUST are listed but never drawn
  // here, because the shutdown screen has no ghost word and no rejection.
  const PALETTES = {
    dark:  { BONE: "#CFC9B0", DIM: "#4A4638", CHROME: "#55503F",
             RUST: "#B0563F", GROUND: "#050505" },
    light: { BONE: "#3B382F", DIM: "#8F876C", CHROME: "#847C62",
             RUST: "#9D3B23", GROUND: "#CFC9B4" },
    // Flexoki Light, using the scheme's own tokens: paper for GROUND, tx for
    // BONE, tx-3 for DIM. CHROME is base-500 rather than tx-2, and RUST is
    // red-400 rather than red-600 -- at their contrast against paper (4.97 and
    // 6.23) those two read as primary text and as a shout, which is not the
    // job either of them has here. Still a much crisper set than the YoRHa
    // one: BONE lands at 18.6:1 against 12.3:1 in the dark theme.
    flexoki: { BONE: "#100F0F", DIM: "#B7B5AC", CHROME: "#878580",
               RUST: "#D14D41", GROUND: "#FFFCF0" },
  };
  const KEYS = ["BONE", "DIM", "CHROME", "RUST", "GROUND"];
  const DRAWN = ["BONE", "CHROME", "GROUND"];
  const custom = { ...PALETTES.light };

  const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const toHex = c => "#" + c.map(v =>
    Math.max(0, Math.min(255, Math.round(v))).toString(16)
      .padStart(2, "0")).join("").toUpperCase();
  const blend = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);

  let BONE, CHROME, GROUND, GROUND_HEX;

  const palRow = document.getElementById("palrow");
  const swatchInputs = {};

  for (const key of KEYS) {
    const label = document.createElement("label");
    label.className = DRAWN.includes(key) ? "key" : "key inert";
    if (!DRAWN.includes(key)) label.title = "not drawn on this screen";
    const input = document.createElement("input");
    input.type = "color";
    input.disabled = true;
    input.setAttribute("aria-label", key);
    input.addEventListener("input", () => {
      custom[key] = input.value.toUpperCase();
      applyPalette("custom");
    });
    const nameEl = document.createElement("span");
    nameEl.textContent = key;
    const valueEl = document.createElement("b");
    label.append(input, nameEl, valueEl);
    palRow.append(label);
    swatchInputs[key] = { input, value: valueEl };
  }

  const confOut = document.createElement("code");
  confOut.id = "confout";
  palRow.append(confOut);

  function applyPalette(name) {
    const p = name === "custom" ? custom : PALETTES[name];

    BONE = hexToRgb(p.BONE);
    CHROME = hexToRgb(p.CHROME);
    GROUND = hexToRgb(p.GROUND);
    GROUND_HEX = p.GROUND;

    const step = k => toHex(blend(GROUND, BONE, k));
    const root = document.documentElement.style;
    root.setProperty("--ground", p.GROUND);
    root.setProperty("--bone", p.BONE);
    root.setProperty("--bone-dim", p.DIM);
    root.setProperty("--chrome", p.CHROME);
    root.setProperty("--chrome-hi", toHex(blend(CHROME, BONE, 0.42)));
    root.setProperty("--rust", p.RUST);
    root.setProperty("--panel", step(0.03));
    root.setProperty("--line", step(0.08));
    root.setProperty("--field", p.GROUND);
    root.setProperty("--border", step(0.12));

    for (const key of KEYS) {
      const sw = swatchInputs[key];
      sw.input.value = p[key].toLowerCase();
      sw.input.disabled = name !== "custom";
      sw.value.textContent = p[key];
    }
    confOut.textContent = KEYS.map(k => `${k}=${p[k]}`).join("  ");
  }

  applyPalette("dark");

  document.getElementById("palette").addEventListener("change", e => {
    applyPalette(e.target.value);
  });

  const S = 0.70; // same size factor as the login screen and build-theme.py

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const msgInput = document.getElementById("msg");
  const subInput = document.getElementById("sub");
  const readout = document.getElementById("readout");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = 0, H = 0, dpr = 1;
  let variant = 1;
  let start = performance.now();

  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function setVariant(v) {
    variant = v;
    for (const [i, id] of ["v1", "v2", "v3"].entries())
      document.getElementById(id).setAttribute("aria-pressed", String(i + 1 === v));
    readout.textContent = "variant " + "ABC"[v - 1];
    start = performance.now();
  }

  function drawBrackets(alpha) {
    const bw = W * 0.30 * S, bh = H * 0.20 * S;
    const x0 = W / 2 - bw / 2, x1 = W / 2 + bw / 2;
    const y0 = H * 0.47 - bh / 2, y1 = H * 0.47 + bh / 2;
    const arm = Math.min(bw, bh) * 0.07;
    ctx.strokeStyle = rgba(BONE, 0.28 * alpha);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0, y0 + arm); ctx.lineTo(x0, y0); ctx.lineTo(x0 + arm, y0);
    ctx.moveTo(x1 - arm, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0 + arm);
    ctx.moveTo(x0, y1 - arm); ctx.lineTo(x0, y1); ctx.lineTo(x0 + arm, y1);
    ctx.moveTo(x1 - arm, y1); ctx.lineTo(x1, y1); ctx.lineTo(x1, y1 - arm);
    ctx.stroke();
  }

  function frame() {
    const t = (performance.now() - start) / 1000;
    ctx.fillStyle = GROUND_HEX;
    ctx.fillRect(0, 0, W, H);

    // fade in over ~0.9s, then hold; a very slow breath keeps it alive
    const fadeIn = reduced ? 1 : Math.min(1, t / 0.9);
    const breath = reduced ? 1 : 0.94 + 0.06 * (Math.cos(t * 0.7) + 1) / 2;
    const a = fadeIn * breath;

    const cy = H * 0.47;
    const size = Math.min(H * 0.032, W * 0.021) * S;

    if (variant === 3) drawBrackets(fadeIn);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `400 ${size}px "JetBrains Mono", monospace`;
    ctx.fillStyle = rgba(BONE, 0.92 * a);
    ctx.fillText(msgInput.value, W / 2, variant === 1 ? cy : cy - H * 0.028 * S);

    if (variant === 2 || variant === 3) {
      const lw = W * 0.24 * S;
      const ly = cy + H * 0.012 * S;
      ctx.fillStyle = rgba(BONE, 0.30 * fadeIn);
      ctx.fillRect(W / 2 - lw / 2, ly, lw, 2);

      ctx.font = `400 ${H * 0.015 * S}px "JetBrains Mono", monospace`;
      ctx.letterSpacing = "0.22em";
      ctx.fillStyle = rgba(CHROME, 0.85 * fadeIn);
      ctx.fillText(subInput.value, W / 2, ly + H * 0.040 * S);
      ctx.letterSpacing = "0px";
    }

    requestAnimationFrame(frame);
  }

  document.getElementById("v1").addEventListener("click", () => setVariant(1));
  document.getElementById("v2").addEventListener("click", () => setVariant(2));
  document.getElementById("v3").addEventListener("click", () => setVariant(3));
  document.getElementById("replay").addEventListener("click", () => { start = performance.now(); });
  addEventListener("resize", resize);

  resize();
  const go = () => requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go);
  else go();
})();
</script>
